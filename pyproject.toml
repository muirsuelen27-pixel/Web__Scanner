[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scanner-defensive"
version = "2.0.0b1"
description = "Desktop-first, evidence-based defensive web auditing."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Web Scanner contributors"}]
dependencies = [
    "requests>=2.31,<3",
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
reports = ["reportlab>=4.0,<5"]
dev = ["pytest>=8,<9"]

[project.scripts]
web-scanner = "scanner.cli:main"

[tool.setuptools]
package-dir = {scanner = "."}
packages = ["scanner", "scanner.modules"]

